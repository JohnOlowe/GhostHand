# ---- Gradle / JVM ----
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.language=en
systemProp.user.country=US

# ---- AndroidX ----
android.useAndroidX=true
android.nonTransitiveRClass=true

# ---- Signing ----------------------------------------------------------------
# The SAME keystore that PalmPay-Clone signs with lives in keystore/.
# Pinning debug builds to one stable key means every CI artifact has an identical
# signature, so a new APK installs cleanly over the previous one (no
# INSTALL_FAILED_UPDATE_INCOMPATIBLE / signature-mismatch uninstalls).
# app/build.gradle.kts reads these four properties; nothing is hard-coded there.
GHOSTHAND_STORE_FILE=keystore/damjay_debug.keystore
GHOSTHAND_STORE_PASSWORD=1b53591ced9ecd8d978eb6ef01b32498
GHOSTHAND_KEY_ALIAS=photo-triage
GHOSTHAND_KEY_PASSWORD=1b53591ced9ecd8d978eb6ef01b3249
